name: Bootstrap production SSH key

on:
  workflow_dispatch:
    inputs:
      install_key:
        description: Install the dedicated deploy key after verifying legacy access
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Install SSH client helper
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Prepare trusted SSH configuration
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KNOWN_HOSTS"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify legacy password access
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PASSWORD"

          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o HostKeyAlias=vs243.mirohost.net \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'printf "Legacy production SSH access is active.\n"'
          unset SSHPASS

      - name: Install and verify the dedicated deploy key
        if: ${{ inputs.install_key }}
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PUBLIC_KEY: ${{ secrets.PRODUCTION_SSH_PUBLIC_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PASSWORD"
          test -n "$SSH_PUBLIC_KEY"
          test -n "$SSH_PRIVATE_KEY"

          printf '%s\n' "$SSH_PUBLIC_KEY" > "$RUNNER_TEMP/bona-production.pub"
          chmod 600 "$RUNNER_TEMP/bona-production.pub"

          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh-copy-id \
            -f \
            -i "$RUNNER_TEMP/bona-production.pub" \
            -o HostKeyAlias=vs243.mirohost.net \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST"
          unset SSHPASS

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/bona-production"
          chmod 600 "$RUNNER_TEMP/bona-production"
          ssh \
            -i "$RUNNER_TEMP/bona-production" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o HostKeyAlias=vs243.mirohost.net \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'printf "Dedicated production deploy key is active.\n"'
