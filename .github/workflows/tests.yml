name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      # Matches production: MariaDB, not MySQL.
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bona_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # The version the site runs on.
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, gd, zip, bcmath, intl
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run the tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bona_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan migrate --force
          ./vendor/bin/phpunit
